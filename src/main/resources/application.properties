spring.application.name=AutoEscola3ESS
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/autoescola3ess
spring.datasource.username=root
spring.datasource.password=fiap

api.security.token.secret=12345678

# ==== CORS: origens (front-ends) autorizadas a consumir a API, separadas por virgula ====
api.cors.allowed-origins=https://www.enderecodomeufront.com.br,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500

# ==== API externa consumida (ViaCEP) ====
api.viacep.url=https://viacep.com.br/ws

# ==== Swagger / OpenAPI (springdoc) ====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
